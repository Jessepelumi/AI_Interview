services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skylark
      POSTGRES_USER: skylark
      POSTGRES_PASSWORD: skylark
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skylark"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    volumes: [".:/app"]
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
